name: Windows Desktop

on:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-desktop-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt
          pip install pyinstaller==6.11.1

      - name: Build Windows application
        working-directory: desktop
        run: |
          pyinstaller --noconfirm --clean --windowed --name VideoDownloader --collect-all imageio_ffmpeg main.py

      - name: Package portable application
        shell: pwsh
        run: |
          Compress-Archive -Path desktop/dist/VideoDownloader -DestinationPath VideoDownloader-Windows-x64.zip -Force

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-Windows-x64
          path: VideoDownloader-Windows-x64.zip
          if-no-files-found: error

      - name: Publish Windows release
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        run: |
          if (gh release view v1.3.0 --repo "$env:GITHUB_REPOSITORY" 2>$null) {
            gh release upload v1.3.0 VideoDownloader-Windows-x64.zip --repo "$env:GITHUB_REPOSITORY" --clobber
          } else {
            gh release create v1.3.0 VideoDownloader-Windows-x64.zip --repo "$env:GITHUB_REPOSITORY" --title "VideoDownloader 1.3.0 - MP3 Edition" --notes "Windows portable edition with MP3 conversion from supported audio/video media URLs. Includes FFmpeg. Existing Android APK remains available in v1.1.2."
          }
