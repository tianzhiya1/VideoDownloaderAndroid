name: Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-video-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk VideoDownloader-Android.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-Android
          path: VideoDownloader-Android.apk
          if-no-files-found: error
      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v1.3.0"
          gh release view "$VERSION" >/dev/null 2>&1 || gh release create "$VERSION" --title "VideoDownloader Android $VERSION" --notes "Adds yt-dlp powered YouTube and supported-site downloads. Android 7.0+; ARM64 and x86_64. No DRM or paywall bypass."
          gh release upload "$VERSION" VideoDownloader-Android.apk --clobber
